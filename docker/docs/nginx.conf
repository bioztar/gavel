# Serves the eight Cloture decks, and nothing else.
#
# The allowlist is enforced by the compose mounts, not here: each deck is bind-mounted
# into this root individually, so docs/CREDENTIALS.md, docs/DEPLOYMENT.md and the rest of
# the internal markdown are not in the container's filesystem at all. A path traversal or
# a mistake in this file therefore cannot reach them. `try_files … =404` is the second
# layer, not the first.
server {
    listen 8799;
    server_name _;
    root /srv/docs;
    index index.html;
    charset utf-8;

    # Traefik terminates TLS and strips /docs, so nginx's own idea of the host and scheme
    # is the container's, not the browser's. Without this, the directory redirect nginx
    # emits for a missing trailing slash points at http://<container-id>:8799/.
    absolute_redirect off;

    # These pages are linked from a public GitHub repo, but a live HTTPS URL next to a
    # running service is a different act from a file in a repo. Keep them out of indexes.
    # This stops compliant crawlers. It is not access control.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # index.html fetches tasks.json at request time with cache:'no-store' and falls back
    # to a baked-in copy when it 404s — which renders a page that looks fine and is stale.
    # Serve it uncached so that never happens quietly.
    # nginx's add_header does not inherit into a location that declares its own, so the
    # noindex/nosniff pair from the server block has to be repeated here by hand.
    location = /tasks.json {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        default_type application/json;
    }

    # /pitch, /status, /blueprint … resolve to the .html without the extension.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
