<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>gavel — live stream</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 1.5rem; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 1rem; }
  video { width: 100%; max-width: 960px; background: #000; display: block; }
  #status { font-family: ui-monospace, monospace; font-size: 0.85rem; margin-top: 0.75rem; }
</style>
</head>
<body>
<h1>gavel — live stream</h1>
<video id="video" controls autoplay muted playsinline></video>
<div id="status">waiting for stream…</div>

<script>
const statusEl = document.getElementById("status");
const video = document.getElementById("video");

async function loadStream() {
  let resp;
  try {
    resp = await fetch("/stream/status");
  } catch (err) {
    statusEl.textContent = `/stream/status unreachable: ${err}`;
    return;
  }
  const body = await resp.json();
  if (!body.active || !body.hlsUrl) {
    statusEl.textContent = "no active stream — waiting…";
    return;
  }
  statusEl.textContent = `live — sessionId=${body.sessionId}`;
  playHls(body.hlsUrl);
}

function playHls(hlsUrl) {
  if (video.dataset.src === hlsUrl) return; // already playing this URL
  video.dataset.src = hlsUrl;

  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(hlsUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.ERROR, (_event, data) => {
      if (data.fatal) statusEl.textContent = `hls.js fatal error: ${data.type} / ${data.details}`;
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    // Safari plays HLS natively
    video.src = hlsUrl;
  } else {
    statusEl.textContent = "this browser cannot play HLS";
  }
}

loadStream();
setInterval(loadStream, 5000);
</script>
</body>
</html>
