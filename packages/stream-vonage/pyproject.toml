[project]
name = "gavel-stream-vonage"
version = "0.1.0"
description = "gavel stream-vonage: broadcast the stage on Vonage Video (HLS + archive), alongside Discord."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    # Official Vonage server SDKs — token minting, X-OPENTOK-AUTH and the RS256
    # application JWT are the vendor's problem, not ours. `vonage` covers the
    # current Application/JWT auth style; `opentok` covers the legacy TokBox
    # (API key + secret) style. See vonage.py's module docstring.
    "vonage>=4.9",
    "opentok>=3.15",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "pytest-httpx>=0.36",
    "ruff>=0.15",
    "pyright>=1.1.408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_vonage"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "BLE", "T20", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"tests/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["stream_vonage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportPrivateImportUsage = false
