<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>gavel — chair</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #stage-video {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        background: #000;
      }
      #stage-status {
        position: fixed;
        bottom: 8px;
        right: 12px;
        color: rgba(255, 255, 255, 0.35);
        font: 12px monospace;
      }
      #start-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        font: 20px sans-serif;
        cursor: pointer;
      }
      #start-overlay[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Muted on purpose. Karen is heard for real in the Discord call; this
         stream is only the picture of her saying it. Unmuted, the endpoint's
         own re-synthesised voice played a beat behind the real one, which is
         what made her land as creepy. Muted also means autoplay is never
         blocked, so the click overlay is now just a fallback. -->
    <video id="stage-video" autoplay playsinline muted></video>
    <div id="stage-status">idle</div>
    <!-- Starts hidden: muted autoplay is not blocked, so this is the recovery
         path and entry.mjs reveals it if (and only if) play() is refused. Left
         visible it covered Karen's face until somebody clicked it, which on the
         meeting-room page (an iframe someone screen-shares) nobody would. -->
    <div id="start-overlay" hidden>Click to start the chair</div>
    <script type="module" src="/stage/stage.bundle.js"></script>
  </body>
</html>
