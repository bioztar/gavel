[project]
name = "gavel-chair-video"
version = "0.1.0"
description = "gavel chair-video: talking-head video for the chair's spoken audio, via fal."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    "structlog>=26.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "pytest-httpx>=0.36",
    "ruff>=0.15",
    "pyright>=1.1.408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chair_video"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "BLE", "T20", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"tests/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["chair_video"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportPrivateImportUsage = false
