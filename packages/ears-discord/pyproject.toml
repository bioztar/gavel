[project]
name = "gavel-ears-discord"
version = "0.1.0"
description = "gavel ears-discord: Discord voice in, speaking events + per-speaker transcripts out."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # Voice receive under DAVE is unreleased everywhere in Python. This pins py-cord's
    # receive PR (#3159) — the one Python branch with DAVE decrypt on inbound audio.
    # Everything py-cord-specific lives in src/ears/voice.py.
    "py-cord[voice] @ git+https://github.com/Pycord-Development/pycord@10a5e8cf13bd8db21f95baf62cf866056d1e1091",
    "numpy>=2.3",
    # web
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    # config / models
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    # data
    "sqlalchemy[asyncio]>=2.0.54",
    "asyncpg>=0.31",
    "alembic>=1.20",
    "redis[hiredis]>=8.1",
    # http
    "httpx>=0.28",
    # logging
    "structlog>=26.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "fakeredis>=2.33",
    "pytest-httpx>=0.36",
    "aiosqlite>=0.22",
    "websockets>=15.0",
    "ruff>=0.15",
    "pyright>=1.1.408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ears"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "BLE", "T20", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"tests/*" = ["T20"]
"alembic/*" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["ears"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportPrivateImportUsage = false
