# Postgres + Redis for ears. `just up-deps`. Both are optional at runtime:
# ears keeps serving the brain over the wire when either is down.
name: gavel-ears

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gavel
      POSTGRES_PASSWORD: gavel
      POSTGRES_DB: gavel
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gavel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
