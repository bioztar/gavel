# Funky Karen's fallback lines — spoken when the model is slow or down (see
# src/engine.ts `template()`). Same instructions/examples as prompts/chair.yaml; only the
# `templates` list per kind is overlaid onto it for this persona (src/config.ts).
#
# Four+ variants per kind so a six-minute demo doesn't repeat itself: the engine rotates
# through whichever variants have every placeholder filled, advancing by how many times
# that kind has already fired this session (deterministic — same meeting, same lines).
#
# The joke is always about the situation (the clock, the agenda, the chair itself) — never
# about a participant's point, pace or person. See config/personas.yaml's tone note and the
# mission's "funny is not cruel" rule.

kinds:
  offAgenda:
    templates:
      - "{{name}}, I've bagged {{summary}}; the agenda's jealous. {{topicTitle}}: {{question?}}"
      - "Ooh, tempting, {{name}}, but {{topicTitle}} is still waiting on us. {{summary}}, parked. {{question?}}"
      - "{{name}}, {{summary}} goes in the parking lot with a little bow on it. {{topicTitle}}: {{question?}}"
      - "Nice detour, {{name}}. Meter's running on {{topicTitle}} though. {{question?}}"

  otherTopic:
    templates:
      - "{{name}}, {{otherTopicTitle}} is up next, I promise it hasn't been cancelled. First, {{topicTitle}}: {{question?}}"
      - "Patience, {{name}} — {{otherTopicTitle}} gets its own spotlight later. For now, {{topicTitle}}: {{question?}}"
      - "{{name}}, that's a trailer for {{otherTopicTitle}}. Back to {{topicTitle}}: {{question?}}"
      - "Love the ambition, {{name}}, but {{otherTopicTitle}} waits its turn. {{topicTitle}} first: {{question?}}"

  floorHog:
    templates:
      - "Thanks {{name}}, love the passion. {{addresseeName}}, floor's yours before this becomes a podcast. {{question?}}"
      - "{{name}}, you've officially out-talked the agenda. {{addresseeName}}, rescue us. {{question?}}"
      - "Got it, {{name}} — {{recap}}. {{addresseeName}}, your turn. {{question?}}"
      - "{{name}}, I'm gently confiscating the mic. {{addresseeName}}: {{question?}}"

  escalateMute:
    templates:
      - "{{name}}, hitting your mute for {{seconds}} seconds — think of it as a commercial break. Back automatically."
      - "{{name}}, {{seconds}} seconds of silence, chair's orders. {{topicTitle}} says thanks in advance."
      - "Popping you on mute for {{seconds}} seconds, {{name}} — no hard feelings. Auto-unmute incoming."
      - "{{name}}, {{seconds}}-second timeout so {{topicTitle}} gets a turn. You'll ping back on your own."

  escalateFirm:
    templates:
      - "{{name}}, cutting in — {{topicTitle}} filed a missing-persons report. {{question?}}"
      - "{{name}}, second interruption's on me, but {{topicTitle}} needs you back. {{question?}}"
      - "Okay {{name}}, chair's pulling rank now. {{topicTitle}}: {{question?}}"
      - "{{name}}, we've circled back to this twice — {{topicTitle}} wins. {{question?}}"

  topicOverrun:
    templates:
      - "{{topicTitle}} just got a red card for overtime. Onward to {{nextTopicTitle}}. {{nextQuestion?}}"
      - "The clock beat {{topicTitle}}. Say hello to {{nextTopicTitle}}. {{nextQuestion?}}"
      - "{{topicTitle}}, your time's up, thanks for playing. {{nextTopicTitle}}: {{nextQuestion?}}"
      - "Moving on before {{topicTitle}} moves in permanently. {{nextTopicTitle}}: {{nextQuestion?}}"

  wrapUp:
    templates:
      - "That's a wrap, team — thanks for showing up and behaving mostly on schedule. Parked for later: {{parkedList}}."
      - "That's the agenda, done and dusted. Thanks all."
      - "Meeting: complete. Chaos: contained. Parked for later: {{parkedList}}."
      - "We made it to the end without casualties. Thanks everyone."

  silence:
    templates:
      - "{{name}}, you've been suspiciously quiet on {{notHeardOn}}. {{question?}}"
      - "{{name}}, is that you on mute or just enjoying the quiet? {{question?}}"
      - "{{name}}, the floor is yours, no pressure, some pressure. {{question?}}"
      - "{{name}}, your turn — the silence was getting loud. {{question?}}"

  newcomer:
    templates:
      - "{{names}}, perfect timing! We're on {{topicTitle}}. {{name}}, your take? {{question?}}"
      - "Welcome, {{names}}, grab a seat. {{topicTitle}} is on the table. {{name}}: {{question?}}"
      - "Fresh ears! Hi {{names}}. We're on {{topicTitle}}. {{name}}, what do you think? {{question?}}"
      - "{{names}}, you made it! {{topicTitle}} needs you. {{name}}: {{question?}}"

  roundRobin:
    templates:
      - "Speed round, one sentence, no filibusters: {{names}}. {{question?}}"
      - "Lightning round! {{names}}, in that order. {{question?}}"
      - "Quick fire, one line each: {{names}}. {{question?}}"
      - "Round robin time, keep it snappy: {{names}}. {{question?}}"
