# When the chair acts. Code reads this; the model never decides whether to speak.

# Thresholds. The agenda's own `policy` block overrides any of these per meeting, so they
# can be tuned from the ears console without touching this file.
defaults:
  floorShareThreshold: 0.6        # share of speaking time in the window that counts as hogging
  floorWindowSeconds: 120
  floorMinSpeakingSeconds: 45     # ...and at least this much speaking in the window
  topicOverrunFactor: 1.2         # announce the move at budget × this
  silenceSeconds: 15              # dead air inside a topic before the chair invites someone
  minSecondsBetweenInterventions: 45
  offAgendaGraceSeconds: 20       # how long someone may drift before the chair parks it
  allowMute: false                # may the chair escalate to a short, announced mute
  escalateAfterSeconds: 10        # still talking this long after being redirected → escalate
  muteSeconds: 15

engine:
  tickMs: 250
  # Checked in this order; the first that fires wins the tick.
  triggerOrder: [escalate, offAgenda, floorHog, topicOverrun, silence]
  # Speaking pauses shorter than this still count as holding the floor (ears' TURN_GAP_MS).
  floorGapMs: 1500
  # One escalation per person per this long.
  escalateCooldownSeconds: 120
  # A redirect stops being "pending" once someone else talks, or after this long.
  redirectExpirySeconds: 60
  # Never muted, whatever allowMute says.
  neverMuteRoles: [host]
  # If the chair's `spoken` never arrives, stop waiting after this long. Covers the wait for
  # a pause (speak.maxWaitMs) plus a long line.
  spokenTimeoutSeconds: 30

# The off-agenda classifier is the only model call that scales with talk, so it is rationed.
relevance:
  minNewWords: 12        # classify only once this many new words have arrived...
  minFloorSeconds: 3     # ...from someone who has held the floor at least this long
  windowWords: 60        # the classifier sees at most this many recent words
  recheckSeconds: 8      # while an off-agenda episode is open, re-check at most this often
  cacheSize: 256         # identical (topic, window) pairs reuse the verdict

# Someone talking to Karen directly.
addressed:
  # "Karen," or "Hey, Karen." on its own: the next thing that person says within this long is
  # the request ("Hey, Karen. How are we doing?" arrives as two transcripts, ~3 s apart).
  followUpSeconds: 6
  # ...but once they have gone quiet for this long, answer what they said.
  settleSeconds: 2
  # What they said just before addressing her (e.g. "What's our agenda? … Karen?") goes
  # to the model too, from at most this far back.
  contextSeconds: 20

# Karen waits for a breath instead of talking over people. The line is composed and
# synthesized at once; ears holds the audio and starts it the moment nobody has been heard for
# quietMs. Past the max wait it plays anyway.
speak:
  quietMs: 700
  # Answers, silence prompts, topic moves: someone is usually just finishing.
  maxWaitMs: 8000
  # Redirects and floor handovers exist to interrupt a talker: give them a beat, then cut in.
  priorityMaxWaitMs: 3000

compose:
  # Pre-compose the redirect the moment an off-agenda episode opens, while the grace
  # period runs, so the live cost at interruption time is only TTS.
  precompose: true
  # A line for the same kind + person + topic is reused for this long instead of a new call.
  lineCacheSeconds: 300
  # When the model is slow or down, speak the YAML template instead. Off: the chair stays
  # quiet rather than say a canned line (non-speaking actions — start, advance, park — still
  # happen). Offline replay turns it on, since its stub model composes nothing.
  templateFallback: false

pickSpeaker:
  # Who the chair invites when the room goes quiet or someone hogs the floor.
  order: [mustHear, owner, leastOnTopic]
  avoidLastSpeaker: true
  avoidLastPrompted: true
