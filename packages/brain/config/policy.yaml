# When the chair acts. Code reads this; the model never decides whether to speak.

# Thresholds. The agenda's own `policy` block overrides any of these per meeting, so they
# can be tuned from the ears console without touching this file.
defaults:
  floorShareThreshold: 0.6        # share of speaking time in the window that counts as hogging
  floorWindowSeconds: 120         # ...measured afresh after each floor handover
  # Two handover thresholds, both counting the talker's speaking time in the window above.
  softHandoverSeconds: 45         # past this, Karen hands the floor on at their next pause
  hardHandoverSeconds: 90         # still holding it past this, she cuts in at once as priority
                                  # speaker. 0: never cut in. Below the soft one: always cut in
  topicOverrunFactor: 1.2         # announce the move at budget × this
  silenceSeconds: 15              # dead air inside a topic before the chair invites someone
  minSecondsBetweenInterventions: 45
  offAgendaGraceSeconds: 20       # how long someone may drift before the chair parks it
  allowMute: false                # may the chair escalate to a short, announced mute
  escalateAfterSeconds: 10        # still talking this long after being redirected → escalate
  muteSeconds: 15
  requireStart: true              # wait for "Karen, let's start the meeting"; false: she opens it herself
  timed: true                     # topic budgets and agenda order; false: any order, no time limits

engine:
  tickMs: 250
  # Checked in this order; the first that fires wins the tick.
  triggerOrder: [escalate, offAgenda, floorHog, topicOverrun, newcomer, silence]
  # Speaking pauses shorter than this still count as holding the floor (ears' TURN_GAP_MS).
  floorGapMs: 1500
  # One escalation per person per this long.
  escalateCooldownSeconds: 120
  # A redirect stops being "pending" once someone else talks, or after this long.
  redirectExpirySeconds: 60
  # Never muted, whatever allowMute says.
  neverMuteRoles: [host]
  # If the chair's `spoken` never arrives, stop waiting after this long. Covers the wait for
  # a pause (speak.maxWaitMs) plus a long line.
  spokenTimeoutSeconds: 30
  # With requireStart off, the chair opens this long after everyone expected is in the call.
  autoStartDelayMs: 3000

# The off-agenda classifier is the only model call that scales with talk, so it is rationed.
relevance:
  minNewWords: 12        # classify only once this many new words have arrived...
  minFloorSeconds: 3     # ...from someone who has held the floor at least this long
  windowWords: 60        # the classifier sees at most this many recent words
  recheckSeconds: 8      # while an off-agenda episode is open, re-check at most this often
  cacheSize: 256         # identical (topic, window) pairs reuse the verdict

# The status board's tidy notes (prompts/digest.yaml). One model call per change in the notes,
# at most this often.
digest:
  minIntervalSeconds: 20
  minItems: 3            # below this many notes there is nothing to merge

# Someone talking to Karen directly.
addressed:
  # "Karen," or "Hey, Karen." on its own: the next thing that person says within this long is
  # the request ("Hey, Karen. How are we doing?" arrives as two transcripts, ~3 s apart).
  followUpSeconds: 6
  # ...but once they have gone quiet for this long, answer what they said.
  settleSeconds: 2
  # What they said just before addressing her (e.g. "What's our agenda? … Karen?") goes
  # to the model too, from at most this far back.
  contextSeconds: 20

# The channel's recent conversation — everyone's final transcripts and Karen's own lines,
# by name — goes into the model calls, so Karen answers what was actually said.
history:
  seconds: 180          # nothing older than this
  chairWords: 220       # each spoken-line call sees at most this many words of it
  # The off-agenda classifier is the high-volume call: it sees only this much of what the
  # others said (the speaker's own words go in separately). 0 = none.
  relevanceWords: 80

# Karen waits for a breath instead of talking over people. The line is composed and
# synthesized at once; ears holds the audio and starts it the moment nobody has been heard for
# quietMs. Past the max wait it plays anyway.
speak:
  quietMs: 700
  # Answers, silence prompts, topic moves: someone is usually just finishing. Longer than this
  # and the line is about something the room has already moved past.
  maxWaitMs: 2000
  # Redirects (and hard floor handovers) exist to interrupt a talker: cut in at once.
  priorityMaxWaitMs: 0
  # A soft floor handover waits for the talker to take a breath, however long that takes. Past
  # this it plays anyway, rather than hold Karen (and every other trigger) indefinitely. Keep it
  # under engine.spokenTimeoutSeconds minus a long line.
  softMaxWaitMs: 15000

compose:
  # Pre-compose the redirect the moment an off-agenda episode opens, while the grace
  # period runs, so the live cost at interruption time is only TTS.
  precompose: true
  # A pre-composed line for the same kind + person + topic is usable for this long. It is
  # spoken at most once: Karen never says the same line twice in a meeting.
  lineCacheSeconds: 300
  # When the model is slow or down, speak the YAML template instead. Off: the chair stays
  # quiet rather than say a canned line (non-speaking actions — start, advance, park — still
  # happen). Offline replay turns it on, since its stub model composes nothing.
  templateFallback: false
  # Every word is ~0.3 s of Karen holding the room. A line longer than this is asked for
  # once more, shorter; the shorter of the two is spoken. 0 = no limit.
  maxWords: 22

# Someone comes into the call once the meeting is under way: when the room goes quiet, Karen
# welcomes them and asks their take on the question the room is on. Their own hello or "can you
# hear me?" does not count against the quiet. Not bound by minSecondsBetweenInterventions: it
# only ever fills a pause, and a welcome a minute late is no welcome.
newcomer:
  enabled: true
  settleSeconds: 1       # after they join: a moment for their audio to connect
  quietSeconds: 4        # nobody but the newcomers has talked (Karen included) for this long,
                         # counting from before they came in
  withinSeconds: 90      # not welcomed by then: the moment has passed
  joinedWords: 20        # said more than this since joining: they are in the discussion, no welcome

pickSpeaker:
  # Who the chair invites when the room goes quiet or someone hogs the floor.
  order: [mustHear, owner, leastOnTopic]
  avoidLastSpeaker: true
  avoidLastPrompted: true
