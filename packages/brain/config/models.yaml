# Which models the chair uses, what they cost, and how long we wait for them.
# Every id is from Nebius Token Factory, reached through Mastra's model router as
# `nebius/<id>` (auth: NEBIUS_API_KEY). Switch a profile by editing one line, or with the
# env overrides BRAIN_MODEL_FAST / BRAIN_MODEL_NORMAL.

profiles:
  # High volume: labels a speaker's last words against the agenda. Cheap, fast, terse.
  fast:
    model: deepseek-ai/DeepSeek-V4.1-Flash
    temperature: 0
    maxOutputTokens: 160
    timeoutMs: 4000
    # A hybrid reasoning model: with thinking on it spends ~2 s and the whole budget thinking.
    extraBody: { chat_template_kwargs: { thinking: false } }
    # Nebius models are not flagged for native structured output in Mastra's catalog:
    # put the JSON instructions in the prompt instead of relying on response_format.
    jsonPromptInjection: true

  # The chair's spoken line. One or two short sentences, so output is tiny.
  normal:
    model: deepseek-ai/DeepSeek-V4.1-Flash
    # A hybrid reasoning model: with thinking on it spends ~2 s and the whole budget thinking.
    extraBody: { chat_template_kwargs: { thinking: false } }
    temperature: 0.6
    maxOutputTokens: 70
    # A live interruption cannot wait: past this the YAML template is spoken instead.
    timeoutMs: 2500
    # Someone asked Karen directly (or to start) and is waiting for the answer.
    directTimeoutMs: 5000

  # Merges the running notes (facts, decisions, open items, parked) into a deduplicated list
  # for the status board. Off the live path, runs only when the notes change.
  digest:
    model: deepseek-ai/DeepSeek-V4.1-Flash
    temperature: 0
    maxOutputTokens: 700
    timeoutMs: 15000
    # A hybrid reasoning model: with thinking on it spends ~2 s and the whole budget thinking.
    extraBody: { chat_template_kwargs: { thinking: false } }
    jsonPromptInjection: true

# USD per 1M tokens (Nebius catalog, Sept 2026). Used for the cost log in ears' llm_calls.
#
# Bake-off 2026-09-19 (evening), from Barcelona, on prompts rebuilt from a live session: a
# floor-hog handover with three points already parked, a greeting right after Karen's opening
# joke, an off-agenda redirect, and the relevance classifier. Qwen is not used.
#   deepseek-ai/DeepSeek-V4.1-Flash (thinking off)  line 0.9-1.2 s, class ~1.1 s   <- all profiles
#     Kept every rule: never raised a parked point, no second clock joke, clean JSON.
#   deepseek-ai/DeepSeek-V4-Pro (thinking off)       line 0.8-1.4 s. Funnier, but once repeated
#     its previous line word for word. 6x the price.
#   NousResearch/Hermes-4-405B                       line 0.7-1.0 s. Solid, but made a second
#     clock joke and labels offAgenda with a topicId.
#   google/gemma-3-27b-it                            fastest (~0.5 s), drops the question; wraps
#     JSON in code fences. Earlier replay: broke the constrained wrap-up.
#   openai/gpt-oss-120b (reasoning_effort low)       ~0.6 s JSON, but returns empty lines at
#     small token budgets.
#   Kimi-K2.6 / K3, MiniMax-M3, GLM-5.3, Nemotron-Lightning: reasoning models, they spend the
#     whole budget thinking on these short calls. Avoid.
prices:
  deepseek-ai/DeepSeek-V4.1-Flash: { input: 0.30, output: 1.20 }
  deepseek-ai/DeepSeek-V4-Pro: { input: 1.75, output: 3.50 }
  NousResearch/Hermes-4-405B: { input: 1.00, output: 3.00 }
  google/gemma-3-27b-it: { input: 0.10, output: 0.30 }
  nvidia/Nemotron-3_5-Lightning: { input: 0.06, output: 0.24 }
  deepseek-ai/DeepSeek-V4-Flash-0731: { input: 0.14, output: 0.28 }
  zai-org/GLM-5.3-Flash: { input: 0.15, output: 0.50 }
  openai/gpt-oss-120b: { input: 0.15, output: 0.60 }
  MiniMaxAI/MiniMax-M3: { input: 0.30, output: 1.00 }

# The chair's voice, on SLNG. `stream` keeps one WebSocket open and warm (SLNG's unified
# bridge, /v1/bridges/unmute/tts/<model>) and forwards 48 kHz PCM to ears as it arrives.
# Auth: SLNG_API_KEY.
#
# Bake-off 2026-09-19 from Barcelona, eu-west, warm socket, one 18-word line — time from
# sending the text to the first audio:
#   deepgram/aura:2       ~0.2 s   ($0.015/min)   <- Karen: aura-2-thalia-en
#   cartesia/sonic:3.5    0.1-0.4 s ($0.035/min)
#   soniox/tts-rt:v1      ~0.2 s, but ~6 s to finish the line
#   slng/fish/tts:s2.1-pro ~1.3 s streaming, ~1.55 s whole clip over HTTP (the old voice)
# Back to the old voice: transport: http, model: slng/fish/tts:s2.1-pro,
# voice: 16cabdb7f8d240569aff36c9e480d783.
tts:
  transport: stream
  baseUrl: https://eu-west.api.slng.ai
  model: deepgram/aura:2
  voice: aura-2-thalia-en
  language: en
  # Whole line (stream) or whole request (http); past this the line is dropped.
  timeoutMs: 8000
  # Identical lines reuse the audio instead of paying twice.
  cacheSize: 64
