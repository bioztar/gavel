<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Google Meet (fixture)</title>
    <link rel="stylesheet" href="/fixtures/fixtures.css" />
  </head>
  <body class="meet">
    <header class="gbar dark">
      <span class="product">Meet</span>
      <span class="fixture-tag">fixture — not Google</span>
      <span class="clock" id="clock"></span>
    </header>
    <main class="prejoin">
      <section class="preview">
        <div class="camera">
          <div class="avatar">V</div>
          <div class="cam-off">Camera is off</div>
        </div>
        <div class="controls">
          <button type="button" class="round" aria-label="Turn on microphone">🎤</button>
          <button type="button" class="round" aria-label="Turn on camera">📷</button>
        </div>
      </section>
      <section class="join">
        <h1 id="meeting-title">Ready to join?</h1>
        <p class="who">No one else is here</p>
        <div class="join-row">
          <button type="button" class="join-now">Join now</button>
          <button type="button" class="present">Present</button>
        </div>
        <p class="other">Other joining options</p>
      </section>
    </main>
    <script src="/fixtures/fixtures.js"></script>
  </body>
</html>
