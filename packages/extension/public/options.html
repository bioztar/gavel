<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>gavel — options</title>
    <style>
      body {
        font: 14px/1.5 Roboto, system-ui, sans-serif;
        color: #1f1f1f;
        margin: 0;
        padding: 16px;
        width: 380px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #5f6368;
        margin: 12px 0 4px;
      }
      input[type="url"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #c4c7c5;
        border-radius: 6px;
        font: inherit;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 12px;
      }
      button {
        border: 1px solid #c4c7c5;
        border-radius: 999px;
        background: #fff;
        padding: 6px 14px;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: #0b57d0;
        border-color: #0b57d0;
        color: #fff;
      }
      .muted {
        color: #5f6368;
        font-size: 12px;
      }
      .dev {
        display: none;
        margin-top: 12px;
        padding: 8px 10px;
        background: #fff8e1;
        border-radius: 6px;
      }
      .dev.on {
        display: block;
      }
      #status {
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <h1>gavel</h1>
    <p class="muted">Signed in as <span id="who">nobody yet</span>.</p>

    <label for="serverUrl">Server (the calendar service that does the model call)</label>
    <input id="serverUrl" type="url" placeholder="https://gavel.example.com" autocomplete="off" />
    <p class="muted">Only the origin. No key goes here — this extension never holds one.</p>

    <div id="dev" class="dev">
      <label><input id="mockAuth" type="checkbox" /> Dev build: skip Google sign-in and talk to the local mock</label>
    </div>

    <div class="row">
      <button id="save" class="primary" type="button">Save</button>
      <button id="signout" type="button">Sign out</button>
      <span id="status" class="muted"></span>
    </div>
    <p class="muted" id="version"></p>
    <script src="options.js" type="module"></script>
  </body>
</html>
