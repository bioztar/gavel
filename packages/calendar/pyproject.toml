[project]
name = "gavel-calendar"
version = "0.1.0"
description = "gavel calendar: turn a calendar invite into the contract agenda, and a join page that starts the session."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # web
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    # config / models
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    # .ics parsing (RFC 5545 folding, TZID, escaping) — do not hand-roll this
    "icalendar>=6.1",
    # RRULE/RDATE/EXDATE expansion — likewise, do not hand-roll recurrence maths
    "python-dateutil>=2.9",
    # calling ears-discord's HTTP API
    "httpx>=0.28",
    # multipart form bodies for POST /invite
    "python-multipart>=0.0.20",
    # the shared Postgres: this service's own `calendar_invites` table, and the
    # Alembic lineage that creates it. Same database as ears, separate lineage —
    # see src/gavel_calendar/db/models.py and alembic/env.py.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "pytest-httpx>=0.36",
    # the store's round-trip tests run against SQLite, no Postgres required
    "aiosqlite>=0.21",
    "ruff>=0.15",
    "pyright>=1.1.408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gavel_calendar"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "BLE", "T20", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["gavel_calendar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
