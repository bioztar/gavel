name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.32.1
  NODE_VERSION: 24
  PYTHON_VERSION: "3.13"

jobs:
  # Which packages a change touches. Each filter lists the package itself plus the
  # shared files its tests read (docs/CONTRACT.md is prose; packages/contract holds the
  # fixtures). This workflow file is in every filter.
  changes:
    runs-on: ubuntu-latest
    outputs:
      brain: ${{ steps.node.outputs.brain }}
      stage: ${{ steps.node.outputs.stage }}
      extension: ${{ steps.node.outputs.extension }}
      python: ${{ steps.python.outputs.changes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: node
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            brain:
              - 'packages/brain/**'
              - 'packages/contract/**'
              - '.github/workflows/ci.yml'
            stage:
              - 'packages/stage/**'
              - '.github/workflows/ci.yml'
            extension:
              - 'packages/extension/**'
              - '.github/workflows/ci.yml'
      - id: python
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            calendar:
              - 'packages/calendar/**'
              - 'packages/ears-discord/src/ears/meetings.py'
              - '.github/workflows/ci.yml'
            ears-discord:
              - 'packages/ears-discord/**'
              - '.github/workflows/ci.yml'
            ears-meet:
              - 'packages/ears-meet/**'
              - 'packages/contract/**'
              - '.github/workflows/ci.yml'

  brain:
    needs: changes
    if: needs.changes.outputs.brain == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/brain
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: packages/brain/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Offline by default: templates speak, no model, no key. The table goes to a
      # scratch path so the committed evals/results.md is never rewritten by CI.
      - run: pnpm evals --out "$RUNNER_TEMP/evals.md"

  stage:
    needs: changes
    if: needs.changes.outputs.stage == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/stage
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: packages/stage/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # layout.test.ts drives the runner's preinstalled Chrome headless.
      - run: pnpm test

  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/extension
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/audit-bundle.mjs

  python:
    needs: changes
    if: needs.changes.outputs.python != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.python) }}
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: packages/${{ matrix.package }}/uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pyright
      - run: uv run --frozen pytest

  # One check to require on main: green when every job that ran passed, and when a
  # change touched nothing that has tests.
  ci:
    needs: [changes, brain, stage, extension, python]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo ok
