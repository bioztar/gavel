name: gavel

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gavel
      POSTGRES_PASSWORD: gavel
      POSTGRES_DB: gavel
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gavel -d gavel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: gavel-ears:local
    build:
      context: .
      dockerfile: packages/ears-discord/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_DSN: postgresql+asyncpg://gavel:gavel@postgres:5432/gavel
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # calendar keeps one table of its own (`calendar_invites`) in the same
  # database, with its own Alembic lineage stamping `alembic_version_calendar`.
  # Separate from `migrate` above because the two lineages are independent and
  # each service's image carries only its own.
  calendar-migrate:
    image: gavel-calendar:local
    build:
      context: .
      dockerfile: packages/calendar/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_DSN: postgresql+asyncpg://gavel:gavel@postgres:5432/gavel
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ears:
    image: gavel-ears:local
    build:
      context: .
      dockerfile: packages/ears-discord/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      DISCORD_EARS_TOKEN: ${DISCORD_EARS_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_VOICE_CHANNEL_ID: ${DISCORD_VOICE_CHANNEL_ID:-}
      DISCORD_LEAVE_GRACE_SECONDS: ${DISCORD_LEAVE_GRACE_SECONDS:-10}
      DISCORD_STATUS_ENABLED: ${DISCORD_STATUS_ENABLED:-true}
      SLNG_API_KEY: ${SLNG_API_KEY:-}
      SLNG_BASE_URL: ${SLNG_BASE_URL:-https://eu-west.api.slng.ai}
      SLNG_STT_MODEL: ${SLNG_STT_MODEL:-deepgram/nova:3}
      SLNG_STT_LANGUAGE: ${SLNG_STT_LANGUAGE:-en}
      # Karen's voice — keep in step with the brain's config/models.yaml tts block.
      SLNG_TTS_MODEL: ${SLNG_TTS_MODEL:-deepgram/aura:2}
      SLNG_TTS_VOICE: ${SLNG_TTS_VOICE:-aura-2-thalia-en}
      # Empty: the console's picker offers ears' built-in list.
      SLNG_TTS_VOICES: ${SLNG_TTS_VOICES:-}
      STT_MODE: ${STT_MODE:-stream}
      SILENCE_RMS: ${SILENCE_RMS:-60}
      VOICE_ACTIVITY_HOLD_MS: ${VOICE_ACTIVITY_HOLD_MS:-300}
      WIRE_HOST: 0.0.0.0
      WIRE_PORT: 8787
      BRAIN_STATE_URL: http://brain:8788/state
      POSTGRES_DSN: postgresql+asyncpg://gavel:gavel@postgres:5432/gavel
      REDIS_DSN: redis://redis:6379/0
      OPUS_LIB: libopus.so.0
      LOG_JSON: "true"
    ports:
      - "127.0.0.1:${WIRE_PORT:-8787}:8787"
    networks:
      - default
      - traefik-public
    labels:
      # The operator console is the CONTROL PLANE: it starts and ends sessions, edits
      # meetings, and drives the TTS say-box. Publishing it is publishing the ability to
      # make Karen talk in a live call, so the route is off by default and, when on, is
      # unconditionally behind basic auth.
      #
      # Two switches, both required:
      #   GAVEL_CONSOLE_PUBLIC=true   — creates the route at all
      #   GAVEL_CONSOLE_USERS=<htpasswd bcrypt line> — the credential
      # Set them with scripts/set-console-auth.sh, which never echoes the password.
      # With PUBLIC unset the container is exactly as it was: 127.0.0.1:8787 only.
      #
      # PathPrefix(`/api/`) is deliberate and is the whole REST surface — unlike the
      # watch page, there is no read-only subset worth carving out here, because every
      # useful console action is a write. Auth is what makes it safe, not path pruning.
      traefik.enable: "${GAVEL_CONSOLE_PUBLIC:-false}"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-public}
      traefik.http.routers.gavel-console.rule:
        Host(`${GAVEL_DOMAIN:-gavel.pro7ocol.com}`) && (Path(`/console`) ||
        Path(`/live`) || PathPrefix(`/api/`))
      traefik.http.routers.gavel-console.priority: "110"
      traefik.http.routers.gavel-console.entrypoints: websecure
      traefik.http.routers.gavel-console.tls: "true"
      traefik.http.routers.gavel-console.tls.certresolver: mytlschallenge
      traefik.http.routers.gavel-console.middlewares: gavel-console-auth
      traefik.http.middlewares.gavel-console-auth.basicauth.users: ${GAVEL_CONSOLE_USERS:-}
      traefik.http.services.gavel-console.loadbalancer.server.port: "8787"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  brain:
    image: gavel-brain:local
    build:
      context: .
      dockerfile: packages/brain/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      SLNG_API_KEY: ${SLNG_API_KEY:-}
      BRAIN_MODEL_FAST: ${BRAIN_MODEL_FAST:-}
      BRAIN_MODEL_NORMAL: ${BRAIN_MODEL_NORMAL:-}
      CHAIR_PERSONA: ${CHAIR_PERSONA:-funky}
      # Langfuse tracing of every model call; off unless both keys are set.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-}
      # Which ears chairs the call. Default is Discord; for a Google Meet demo set
      #   EARS_WIRE_URL=ws://ears-meet:8787  EARS_HTTP_URL=http://ears-meet:8787
      EARS_WIRE_URL: ${EARS_WIRE_URL:-ws://ears:8787}
      EARS_HTTP_URL: ${EARS_HTTP_URL:-http://ears:8787}
      POSTGRES_DSN: postgresql://gavel:gavel@postgres:5432/gavel
      AGENDA_FILE: /app/contract/fixtures/agenda.demo.json
      STAGE_HOST: 0.0.0.0
      STAGE_PORT: 8788
    ports:
      - "127.0.0.1:${STAGE_PORT:-8788}:8788"
    depends_on:
      postgres:
        condition: service_healthy
      ears:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/state').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  calendar:
    image: gavel-calendar:local
    build:
      context: .
      dockerfile: packages/calendar/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      CALENDAR_HOST: 0.0.0.0
      CALENDAR_PORT: 8790
      CALENDAR_PUBLIC_URL: ${CALENDAR_PUBLIC_URL:-https://gavel.pro7ocol.com}
      CALENDAR_ATTENDEE_MAP: ${CALENDAR_ATTENDEE_MAP:-}
      # JSON, keys from schema.EARS_DEFAULT_POLICY; empty sends no policy at all.
      CALENDAR_POLICY_OVERRIDES: ${CALENDAR_POLICY_OVERRIDES:-}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-30}
      CALENDAR_ICS_FEEDS: ${CALENDAR_ICS_FEEDS:-}
      CALENDAR_FEED_WINDOW_HOURS: ${CALENDAR_FEED_WINDOW_HOURS:-24}
      EARS_API_URL: http://ears:8787
      # The same database as ears, for this service's own `calendar_invites`.
      # Without it the store runs memory-only and every /m/ link dies with the
      # container — which is what `GET /health`'s `durable` flag reports.
      POSTGRES_DSN: postgresql+asyncpg://gavel:gavel@postgres:5432/gavel
      # The meeting room page (GET /m/{id}) reads the chair's live view from the
      # brain server-side. Best-effort: unreachable brain = the agenda or the
      # banked report, no error page; hence no depends_on.
      # Hard-coded like ears' copy: a repo-root .env with a 127.0.0.1 value would
      # otherwise be substituted in here and point this container at itself.
      BRAIN_STATE_URL: http://brain:8788/state
      # compose front door: without NEBIUS_API_KEY the brief falls back to the
      # heuristic parser (logs compose.llm_skipped), which reads a bare time but
      # not intent. RESEND_API_KEY empty keeps the mailer in dry-run by design.
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      COMPOSE_FROM_EMAIL: ${COMPOSE_FROM_EMAIL:-}
      COMPOSE_DEFAULT_ATTENDEES: ${COMPOSE_DEFAULT_ATTENDEES:-}
      COMPOSE_TIMEZONE: ${COMPOSE_TIMEZONE:-Europe/Madrid}
      DISCORD_MEETING_URL: ${DISCORD_MEETING_URL:-}
    volumes:
      # The demo deck, read at request time by GET /architecture. Read-only, and
      # outside the image so it can be edited without a rebuild.
      - ./docs/architecture.html:/app/architecture.html:ro
      # The run sheet, served by GET /demo-script. Same deal: edit, no rebuild.
      - ./docs/demo-script.html:/app/demo-script.html:ro
    ports:
      - "127.0.0.1:${CALENDAR_PORT:-8790}:8790"
    networks:
      - default
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-public}
      traefik.http.routers.gavel-calendar.rule: Host(`${GAVEL_DOMAIN:-gavel.pro7ocol.com}`)
      traefik.http.routers.gavel-calendar.entrypoints: websecure
      traefik.http.routers.gavel-calendar.tls: "true"
      traefik.http.routers.gavel-calendar.tls.certresolver: mytlschallenge
      traefik.http.services.gavel-calendar.loadbalancer.server.port: "8790"
    depends_on:
      calendar-migrate:
        condition: service_completed_successfully
      ears:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Karen's live board. She screen-shares this page from inside the call, so it is a
  # service like any other, not a page anyone is asked to visit. ears-meet finds the tab
  # by its title (STAGE_TAB_TITLE, default `gavel-stage`) and captures it.
  #
  # Host port is STAGE_BOARD_PORT, not STAGE_PORT: brain already owns that name for its
  # own 8788 above, and a repo-root .env would otherwise point this at the wrong service.
  stage:
    image: gavel-stage:local
    build:
      context: .
      dockerfile: packages/stage/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8793
      # Hard-coded for the same reason as ears' copy: a 127.0.0.1 value in a repo-root
      # .env would make this container poll itself.
      BRAIN_STATE_URL: http://brain:8788/state
      BRAIN_POLL_MS: ${BRAIN_POLL_MS:-1000}
    ports:
      - "127.0.0.1:${STAGE_BOARD_PORT:-8793}:8793"
    depends_on:
      brain:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8793/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # ears-meet: a real Chromium on a virtual display, joining a Google Meet as a guest.
  # Same seam as ears-discord — it owns one call connection and decides nothing.
  #
  # Behind the `meet` profile because it is a 5GB image that only earns its keep for a
  # Meet demo:  docker compose --profile meet up -d ears-meet
  #
  # It does NOT collide with the `ears` service on 8787: each container has its own port
  # namespace, and only the published host port differs (8797 here). Point the brain at
  # whichever ears should chair the call:
  #     EARS_WIRE_URL=ws://ears-meet:8787  EARS_HTTP_URL=http://ears-meet:8787
  ears-meet:
    profiles: ["meet"]
    image: gavel-ears-meet:local
    build:
      context: .
      dockerfile: packages/ears-meet/Dockerfile
    init: true
    restart: unless-stopped
    # Chromium dies on the default 64MB /dev/shm as soon as a call has video in it.
    shm_size: "2gb"
    environment:
      MEET_URL: ${MEET_URL:-}
      MEET_BOT_NAME: ${MEET_BOT_NAME:-Karen (gavel)}
      # The mount point inside the container, not a host path — see volumes below.
      MEET_PROFILE_DIR: /profile
      MEET_CAPTIONS: ${MEET_CAPTIONS:-true}
      MEET_ADMIT_TIMEOUT_S: ${MEET_ADMIT_TIMEOUT_S:-180}
      MEET_LEAVE_WHEN_ALONE_S: ${MEET_LEAVE_WHEN_ALONE_S:-120}
      # Karen's camera tile: a still, published as a real video track. No video is
      # generated anywhere. Unset MEET_FACE_IMAGE and she joins with the camera off.
      MEET_FACE_IMAGE: ${MEET_FACE_IMAGE:-assets/persona/karen-formal.png}
      MEET_FACE_FPS: ${MEET_FACE_FPS:-5}
      # The board she shares. Captured by tab title, so both must agree.
      STAGE_URL: ${MEET_STAGE_URL:-http://stage:8793/}
      STAGE_TAB_TITLE: ${STAGE_TAB_TITLE:-gavel-stage}
      WIRE_HOST: 0.0.0.0
      WIRE_PORT: 8787
      AGENDA_FILE: ${MEET_AGENDA_FILE:-/app/contract/fixtures/agenda.demo.json}
      FRAMES_FILE: ${FRAMES_FILE:-}
      SLNG_API_KEY: ${SLNG_API_KEY:-}
      SLNG_BASE_URL: ${SLNG_BASE_URL:-https://eu-west.api.slng.ai}
      SLNG_STT_MODEL: ${SLNG_STT_MODEL:-deepgram/nova:3}
      SLNG_STT_LANGUAGE: ${SLNG_STT_LANGUAGE:-en}
      SLNG_TTS_MODEL: ${SLNG_TTS_MODEL:-deepgram/aura:2}
      SLNG_TTS_VOICE: ${SLNG_TTS_VOICE:-aura-2-thalia-en}
      LOG_JSON: "true"
    volumes:
      # THE CREDENTIAL. A Chromium profile signed in as Karen's Google account, made
      # once on a machine with a screen (`just login`) and copied here. Never committed,
      # never baked into an image, never in a public directory — `secrets/` is gitignored.
      - ${MEET_PROFILE_HOST_DIR:-./secrets/meet-profile}:/profile
      # Every emitted frame, when FRAMES_FILE points in here — the fixture for replay.
      - ./recordings:/recordings
      # The agenda the chair runs. Read-only, outside the image so it can be edited
      # without a rebuild.
      - ./packages/contract/fixtures:/app/contract/fixtures:ro
    ports:
      - "127.0.0.1:${MEET_WIRE_PORT:-8797}:8787"
    depends_on:
      stage:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  # The decks, served read-only behind the shared Traefik so they can be opened on a phone
  # or handed to someone in a meeting.
  #
  # Each file is bind-mounted individually and `docs/` is NOT mounted wholesale. That
  # directory also holds CREDENTIALS.md, DEPLOYMENT.md (VPS hostname and IP),
  # CALENDAR-SETUP.md and the rest of the internal markdown. Those live in a public repo,
  # but a live HTTPS URL beside a running service is a different act from a file in a repo,
  # and the allowlist is what makes the difference auditable. Adding a deck is a line here.
  #
  # It answers on the existing GAVEL_DOMAIN under /docs because that host already resolves
  # to this box and its certificate is already in acme.json — so this adds no new ACME
  # issuance. The cloture.pro7ocol.com router is deliberately absent until that name has a
  # DNS record: the resolver is tls-alpn-01, which fails for a name that does not resolve,
  # and repeated failures burn Let's Encrypt's budget for every service on pro7ocol.com.
  docs:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/docs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docs/index.html:/srv/docs/index.html:ro
      - ./docs/deck.html:/srv/docs/deck.html:ro
      - ./docs/pitch-investor.html:/srv/docs/pitch-investor.html:ro
      # The deck's file is pitch-investor.html, so /docs/pitch would 404 on the
      # $uri.html rule. Mounted twice so the short path people are actually given works.
      - ./docs/pitch-investor.html:/srv/docs/pitch.html:ro
      - ./docs/architecture.html:/srv/docs/architecture.html:ro
      - ./docs/blueprint.html:/srv/docs/blueprint.html:ro
      - ./docs/status.html:/srv/docs/status.html:ro
      - ./docs/demo-your-part.html:/srv/docs/demo-your-part.html:ro
      - ./docs/demo-script.html:/srv/docs/demo-script.html:ro
      - ./docs/avatars.html:/srv/docs/avatars.html:ro
      - ./docs/tasks.json:/srv/docs/tasks.json:ro
    ports:
      - "127.0.0.1:${DOCS_PORT:-8799}:8799"
    networks:
      - default
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-public}
      traefik.http.routers.cloture-docs.rule:
        Host(`${GAVEL_DOMAIN:-gavel.pro7ocol.com}`) && PathPrefix(`/docs`)
      # Above the calendar service's bare Host() router, so /docs keeps working when the
      # rest of the stack comes back up.
      traefik.http.routers.cloture-docs.priority: "120"
      traefik.http.routers.cloture-docs.entrypoints: websecure
      traefik.http.routers.cloture-docs.tls: "true"
      traefik.http.routers.cloture-docs.tls.certresolver: mytlschallenge
      traefik.http.routers.cloture-docs.middlewares: cloture-docs-slash,cloture-docs-strip
      # /docs must redirect to /docs/, or index.html's relative fetch of tasks.json
      # resolves to /tasks.json, 404s, and the board silently renders its stale fallback.
      traefik.http.middlewares.cloture-docs-slash.redirectregex.regex: ^(https?://[^/]+)/docs$$
      traefik.http.middlewares.cloture-docs-slash.redirectregex.replacement: $${1}/docs/
      traefik.http.middlewares.cloture-docs-strip.stripprefix.prefixes: /docs
      # The same decks on their own name, at the root: cloture.pro7ocol.com/pitch.
      # No stripprefix and no slash redirect — there is no prefix to strip, and the root
      # already serves index.html, so index.html's relative fetch of tasks.json resolves.
      # Added 2026-09-22, after the A record for this name was confirmed at the
      # authoritative nameservers and at 8.8.8.8/1.1.1.1. It must stay that way round:
      # the resolver is tls-alpn-01, and a router on a name that does not resolve fails
      # every attempt against a failure budget Let's Encrypt counts per registered
      # domain — i.e. shared with every other pro7ocol.com service on this Traefik.
      traefik.http.routers.cloture-root.rule: Host(`${CLOTURE_DOMAIN:-cloture.pro7ocol.com}`)
      traefik.http.routers.cloture-root.entrypoints: websecure
      traefik.http.routers.cloture-root.tls: "true"
      traefik.http.routers.cloture-root.tls.certresolver: mytlschallenge
      traefik.http.routers.cloture-root.service: cloture-docs
      traefik.http.services.cloture-docs.loadbalancer.server.port: "8799"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8799/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:

  # The decks, served read-only behind the shared Traefik so they can be opened on a phone
  # or handed to someone in a meeting.
  #
  # Each file is bind-mounted individually and `docs/` is NOT mounted wholesale. That
  # directory also holds CREDENTIALS.md, DEPLOYMENT.md (VPS hostname and IP),
  # CALENDAR-SETUP.md and the rest of the internal markdown. Those live in a public repo,
  # but a live HTTPS URL beside a running service is a different act from a file in a repo,
  # and the allowlist is what makes the difference auditable. Adding a deck is a line here.
  #
  # It answers on the existing GAVEL_DOMAIN under /docs because that host already resolves
  # to this box and its certificate is already in acme.json — so this adds no new ACME
  # issuance. The cloture.pro7ocol.com router is deliberately absent until that name has a
  # DNS record: the resolver is tls-alpn-01, which fails for a name that does not resolve,

networks:
  traefik-public:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}
