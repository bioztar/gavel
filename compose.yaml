name: gavel

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gavel
      POSTGRES_PASSWORD: gavel
      POSTGRES_DB: gavel
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gavel -d gavel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: gavel-ears:local
    build:
      context: .
      dockerfile: packages/ears-discord/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_DSN: postgresql+asyncpg://gavel:gavel@postgres:5432/gavel
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # calendar keeps one table of its own (`calendar_invites`) in the same
  # database, with its own Alembic lineage stamping `alembic_version_calendar`.
  # Separate from `migrate` above because the two lineages are independent and
  # each service's image carries only its own.
  calendar-migrate:
    image: gavel-calendar:local
    build:
      context: .
      dockerfile: packages/calendar/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_DSN: postgresql+asyncpg://gavel:gavel@postgres:5432/gavel
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ears:
    image: gavel-ears:local
    build:
      context: .
      dockerfile: packages/ears-discord/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      DISCORD_EARS_TOKEN: ${DISCORD_EARS_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_VOICE_CHANNEL_ID: ${DISCORD_VOICE_CHANNEL_ID:-}
      DISCORD_LEAVE_GRACE_SECONDS: ${DISCORD_LEAVE_GRACE_SECONDS:-10}
      DISCORD_STATUS_ENABLED: ${DISCORD_STATUS_ENABLED:-true}
      SLNG_API_KEY: ${SLNG_API_KEY:-}
      SLNG_BASE_URL: ${SLNG_BASE_URL:-https://eu-west.api.slng.ai}
      SLNG_STT_MODEL: ${SLNG_STT_MODEL:-deepgram/nova:3}
      SLNG_STT_LANGUAGE: ${SLNG_STT_LANGUAGE:-en}
      # Karen's voice — keep in step with the brain's config/models.yaml tts block.
      SLNG_TTS_MODEL: ${SLNG_TTS_MODEL:-deepgram/aura:2}
      SLNG_TTS_VOICE: ${SLNG_TTS_VOICE:-aura-2-thalia-en}
      # Empty: the console's picker offers ears' built-in list.
      SLNG_TTS_VOICES: ${SLNG_TTS_VOICES:-}
      STT_MODE: ${STT_MODE:-stream}
      WIRE_HOST: 0.0.0.0
      WIRE_PORT: 8787
      BRAIN_STATE_URL: http://brain:8788/state
      POSTGRES_DSN: postgresql+asyncpg://gavel:gavel@postgres:5432/gavel
      REDIS_DSN: redis://redis:6379/0
      OPUS_LIB: libopus.so.0
      LOG_JSON: "true"
    ports:
      - "127.0.0.1:${WIRE_PORT:-8787}:8787"
    networks:
      - default
      - traefik-public
    labels:
      # The operator console is the CONTROL PLANE: it starts and ends sessions, edits
      # meetings, and drives the TTS say-box. Publishing it is publishing the ability to
      # make Karen talk in a live call, so the route is off by default and, when on, is
      # unconditionally behind basic auth.
      #
      # Two switches, both required:
      #   GAVEL_CONSOLE_PUBLIC=true   — creates the route at all
      #   GAVEL_CONSOLE_USERS=<htpasswd bcrypt line> — the credential
      # Set them with scripts/set-console-auth.sh, which never echoes the password.
      # With PUBLIC unset the container is exactly as it was: 127.0.0.1:8787 only.
      #
      # PathPrefix(`/api/`) is deliberate and is the whole REST surface — unlike the
      # watch page, there is no read-only subset worth carving out here, because every
      # useful console action is a write. Auth is what makes it safe, not path pruning.
      traefik.enable: "${GAVEL_CONSOLE_PUBLIC:-false}"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-public}
      traefik.http.routers.gavel-console.rule:
        Host(`${GAVEL_DOMAIN:-gavel.pro7ocol.com}`) && (Path(`/console`) ||
        Path(`/live`) || PathPrefix(`/api/`))
      traefik.http.routers.gavel-console.priority: "110"
      traefik.http.routers.gavel-console.entrypoints: websecure
      traefik.http.routers.gavel-console.tls: "true"
      traefik.http.routers.gavel-console.tls.certresolver: mytlschallenge
      traefik.http.routers.gavel-console.middlewares: gavel-console-auth
      traefik.http.middlewares.gavel-console-auth.basicauth.users: ${GAVEL_CONSOLE_USERS:-}
      traefik.http.services.gavel-console.loadbalancer.server.port: "8787"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  brain:
    image: gavel-brain:local
    build:
      context: .
      dockerfile: packages/brain/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      SLNG_API_KEY: ${SLNG_API_KEY:-}
      BRAIN_MODEL_FAST: ${BRAIN_MODEL_FAST:-}
      BRAIN_MODEL_NORMAL: ${BRAIN_MODEL_NORMAL:-}
      CHAIR_PERSONA: ${CHAIR_PERSONA:-funky}
      # Langfuse tracing of every model call; off unless both keys are set.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-}
      EARS_WIRE_URL: ws://ears:8787
      EARS_HTTP_URL: http://ears:8787
      POSTGRES_DSN: postgresql://gavel:gavel@postgres:5432/gavel
      AGENDA_FILE: /app/contract/fixtures/agenda.demo.json
      STAGE_HOST: 0.0.0.0
      STAGE_PORT: 8788
      # Stage hook: engine.ts fire-and-forgets each spoken line to
      # chair-video /director/speak so the projector page shows a talking Karen.
      # Unset = inert (pushToStage returns immediately), which is how it shipped.
      # Deliberately not a depends_on: the push is best-effort with a 2s abort,
      # so a sick chair-video must never hold the brain's boot or its speech.
      CHAIR_VIDEO_URL: ${CHAIR_VIDEO_URL:-http://chair-video:8791}
    ports:
      - "127.0.0.1:${STAGE_PORT:-8788}:8788"
    depends_on:
      postgres:
        condition: service_healthy
      ears:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/state').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  calendar:
    image: gavel-calendar:local
    build:
      context: .
      dockerfile: packages/calendar/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      CALENDAR_HOST: 0.0.0.0
      CALENDAR_PORT: 8790
      CALENDAR_PUBLIC_URL: ${CALENDAR_PUBLIC_URL:-https://gavel.pro7ocol.com}
      CALENDAR_ATTENDEE_MAP: ${CALENDAR_ATTENDEE_MAP:-}
      # JSON, keys from schema.EARS_DEFAULT_POLICY; empty sends no policy at all.
      CALENDAR_POLICY_OVERRIDES: ${CALENDAR_POLICY_OVERRIDES:-}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-30}
      CALENDAR_ICS_FEEDS: ${CALENDAR_ICS_FEEDS:-}
      CALENDAR_FEED_WINDOW_HOURS: ${CALENDAR_FEED_WINDOW_HOURS:-24}
      EARS_API_URL: http://ears:8787
      # The same database as ears, for this service's own `calendar_invites`.
      # Without it the store runs memory-only and every /m/ link dies with the
      # container — which is what `GET /health`'s `durable` flag reports.
      POSTGRES_DSN: postgresql+asyncpg://gavel:gavel@postgres:5432/gavel
      # The meeting room page (GET /m/{id}) reads the chair's live view from the
      # brain server-side, and embeds chair-video's stage as Karen's face. Both
      # are best-effort: unreachable brain = the agenda or the banked report, no
      # error page; hence no depends_on for either.
      # Hard-coded like ears' and stream-vonage's copies: a repo-root .env with a
      # 127.0.0.1 value would otherwise be substituted in here and point this
      # container at itself.
      BRAIN_STATE_URL: http://brain:8788/state
      # Relative on purpose — Traefik routes /stage/ to chair-video on this host.
      CHAIR_VIDEO_STAGE_URL: ${CHAIR_VIDEO_STAGE_URL:-/stage/}
      # compose front door: without NEBIUS_API_KEY the brief falls back to the
      # heuristic parser (logs compose.llm_skipped), which reads a bare time but
      # not intent. RESEND_API_KEY empty keeps the mailer in dry-run by design.
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      COMPOSE_FROM_EMAIL: ${COMPOSE_FROM_EMAIL:-}
      COMPOSE_DEFAULT_ATTENDEES: ${COMPOSE_DEFAULT_ATTENDEES:-}
      COMPOSE_TIMEZONE: ${COMPOSE_TIMEZONE:-Europe/Madrid}
      DISCORD_MEETING_URL: ${DISCORD_MEETING_URL:-}
    volumes:
      # The demo deck, read at request time by GET /architecture. Read-only, and
      # outside the image so it can be edited without a rebuild.
      - ./docs/architecture.html:/app/architecture.html:ro
      # The run sheet, served by GET /demo-script. Same deal: edit, no rebuild.
      - ./docs/demo-script.html:/app/demo-script.html:ro
    ports:
      - "127.0.0.1:${CALENDAR_PORT:-8790}:8790"
    networks:
      - default
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-public}
      traefik.http.routers.gavel-calendar.rule: Host(`${GAVEL_DOMAIN:-gavel.pro7ocol.com}`)
      traefik.http.routers.gavel-calendar.entrypoints: websecure
      traefik.http.routers.gavel-calendar.tls: "true"
      traefik.http.routers.gavel-calendar.tls.certresolver: mytlschallenge
      traefik.http.services.gavel-calendar.loadbalancer.server.port: "8790"
    depends_on:
      calendar-migrate:
        condition: service_completed_successfully
      ears:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  chair-video:
    image: gavel-chair-video:local
    build:
      context: .
      dockerfile: packages/chair-video/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      FAL_KEY: ${FAL_KEY:-}
      HOST: 0.0.0.0
      PORT: 8791
      LIPSYNC_MODEL: ${LIPSYNC_MODEL:-veed/lipsync/v2}
      AVATAR_MODEL: ${AVATAR_MODEL:-fal-ai/flux/schnell}
      FAL_POLL_TIMEOUT_S: ${FAL_POLL_TIMEOUT_S:-120}
      FAL_POLL_INTERVAL_S: ${FAL_POLL_INTERVAL_S:-1}
    ports:
      - "127.0.0.1:${CHAIR_VIDEO_PORT:-8791}:8791"
    networks:
      - default
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-public}
      traefik.http.routers.gavel-karen-video.rule:
        Host(`${GAVEL_DOMAIN:-gavel.pro7ocol.com}`) && (Path(`/karen-video`) || PathPrefix(`/stage/`) || PathPrefix(`/director/`))
      traefik.http.routers.gavel-karen-video.priority: "90"
      traefik.http.routers.gavel-karen-video.entrypoints: websecure
      traefik.http.routers.gavel-karen-video.tls: "true"
      traefik.http.routers.gavel-karen-video.tls.certresolver: mytlschallenge
      traefik.http.services.gavel-karen-video.loadbalancer.server.port: "8791"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/healthz', timeout=7)",
        ]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 5s

  stream-vonage:
    image: gavel-stream-vonage:local
    build:
      context: .
      dockerfile: packages/stream-vonage/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8792
      VONAGE_APPLICATION_ID: ${VONAGE_APPLICATION_ID:-}
      VONAGE_PRIVATE_KEY: ${VONAGE_PRIVATE_KEY:-}
      VONAGE_API_KEY: ${VONAGE_API_KEY:-}
      VONAGE_API_SECRET: ${VONAGE_API_SECRET:-}
      BRAIN_STATE_URL: http://brain:8788/state
      BRAIN_STATE_POLL_SECONDS: ${STREAM_BRAIN_STATE_POLL_SECONDS:-2.0}
    ports:
      - "127.0.0.1:${STREAM_PORT:-8792}:8792"
    networks:
      - default
      - traefik-public
    labels:
      # Only the two read-only routes a viewer needs are published. Exact Path,
      # never PathPrefix: /stream/status must not open /stream/start and /stop,
      # which create sessions and archives and cost money. /publisher, /healthz
      # and /brain-state stay loopback-only.
      #
      # Priority beats calendar's bare Host() rule, which would otherwise swallow
      # these two paths — Traefik's default priority is rule length, and this rule
      # is already longer, but a demo is the wrong place to rely on that.
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-public}
      traefik.http.routers.gavel-watch.rule:
        Host(`${GAVEL_DOMAIN:-gavel.pro7ocol.com}`) && (Path(`/watch`) ||
        Path(`/stream/status`))
      traefik.http.routers.gavel-watch.priority: "100"
      traefik.http.routers.gavel-watch.entrypoints: websecure
      traefik.http.routers.gavel-watch.tls: "true"
      traefik.http.routers.gavel-watch.tls.certresolver: mytlschallenge
      traefik.http.services.gavel-watch.loadbalancer.server.port: "8792"
    depends_on:
      brain:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8792/healthz', timeout=7)",
        ]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 5s

volumes:
  postgres_data:

networks:
  traefik-public:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}
