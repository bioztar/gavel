<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" role="img" aria-label="Cloture">
  <title>Cloture</title>
  <!-- Letterspaced caps, deliberately. The name's one weakness is that people write
       "closure"; spacing the letters makes a reader take them one at a time, which is
       the cheapest available fix for that. Do not tighten the tracking. -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#14161a"/>
  <rect x="10" y="30.5" width="44" height="3" rx="1.5" fill="#6c7280"/>
  <g fill="#c8102e">
    <rect x="28" y="14" width="4.2" height="36" rx="2.1" transform="rotate(14 30.1 32)"/>
    <rect x="37" y="14" width="4.2" height="36" rx="2.1" transform="rotate(14 39.1 32)"/>
  </g>
  <text x="84" y="43" fill="#14161a"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="600" letter-spacing="6.5">CLOTURE</text>
</svg>
